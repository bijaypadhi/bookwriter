<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
   
    <meta name="theme-color" content="#000">
    <link rel="shortcut icon" type="image/webp" href="./img/icon-small.webp"/>
    <link rel="apple-touch-icon" href="./img/icon.webp"/>
    <link rel="manifest" href="./js/manifest.json">
    <link type="text/css" rel="stylesheet" href="./css/read.css"/>
    <link type="text/css" rel="stylesheet" href="./css/navImage.css"/>
    <link type="text/css" rel="stylesheet" href="./css/navMenu.css"/>
    <link type="text/css" rel="stylesheet" href="./css/config.css"/>
    <link type="text/css" rel="stylesheet" href="./css/global.css"/>
	<link type="text/css" rel="stylesheet" href="./css/speechkiit.css"/>
	 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
    #bottomControls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 1000;
}

#bottomControls button {
    background-color: white;
    color: black;
    border: 1px solid black;
    padding: 10px 20px;
    cursor: pointer;
    font-size: 16px;
    border-radius: 5px;
}

#bottomControls button:hover {
    background-color: #f0f0f0;
}

		 #container {
            position: relative;
        }
        .text-area-container {
            position: absolute;
            display: inline-block;
        }
     
	#selectTemplateButton {
        background-color: white;
        color: black;
        border: 1px solid black;
        padding: 10px 20px;
        cursor: pointer;
        font-size: 16px;
        border-radius: 5px;
    }

   
.hidden-textarea {
    position: absolute;
    margin-toptop: 10px;
    left: 0;
    width: 200px;
    height: 100px;
    border: 2px solid red; /* Visible border for identification */
    background: transparent; /* Semi-transparent background for visibility */
    color: black; /* Ensure text is visible */
    resize: none; /* Disable resizing */
    visibility: hidden; /* Hide the text area initially */
    font-size: 16px; /* Adjust font size as needed */
    z-index: 10; /* Ensure it's on top of other elements if necessary */
    pointer-events: auto; /* Ensure it can receive mouse events */
}

#navImage {
    position: relative; /* Ensure positioning for absolute children */
}

#imgPageLeft,
#imgPageRight {
    position: relative;
}
    </style>
</head>

<body>

    <div id="loaderContainer">
        <svg id="loader" viewBox="25 25 50 50">
            <circle class="path" cx="50" cy="50" r="20" fill="none" stroke-width="2" stroke-miterlimit="10"/>
        </svg>
    </div>

    <div id=topMenu class="navMenu">
        <div class="navContainer">
            <div id="bookInfo"><h2 id="bookTitle"></h2><h3 id="bookVolume"></h3></div>
            <div id="fullScreenButton" class="button icon"></div>
            <div id="configButton" class="button icon"></div>
        </div>
    </div>

    <div id="navImageContainer" class="zoom">
        <div id="navImage">
         <img id="imgPageLeft">
        <textarea id="textAreaLeft" class="hidden-textarea" spellcheck="true" readonly></textarea>
        <img id="imgPageRight">
        <textarea id="textAreaRight" class="hidden-textarea" spellcheck="true" readonly></textarea>
            <div id="continuousScrollingPages"></div>
            <div id="filters">
                <div id="paperTexture"></div>
                <div id="bookFold"></div>
                <div id="lighting"></div>
                <div id="specular"></div>
            </div>
        </div>
    </div>

    <div id="bottomMenu" class="navMenu">
        <div class="navContainer">
            <div id="leftChapterButton" class="button icon"></div>
            <div id="chapterSelectionContainer">
                <select id="chapterSelection"></select>
            </div>
            <div id="rightChapterButton" class="button icon"></div>
            <div id="sliderContainer">
                <p id="pageSliderLeft"></p>
                <input id="pageSlider" type="range" min="1" class="slider">
                <p id="pageSliderRight"></p>
            </div>
        </div>
    </div>

    <div id="configMenu" class="darkMode">
        <div id="closeMenu" class="button"><div class="icon"></div></div>
        <div id="pageWidthContainer">
            <p>Page width</p>
            <input id="pageWidthSlider" type="range" min="10" max="100" class="slider">
        </div>
        <div id="doublePageButton" class="button"><div class="icon"></div><p></p></div>
        <div id="paperTextureButton" class="button"><div class="icon"></div><p></p></div>
        <div id="bookFoldButton" class="button"><div class="icon"></div><p></p></div>
        <div id="lightingButton" class="button"><div class="icon"></div><p></p></div>
        <div id="sidePagesButton" class="button"><div class="icon"></div><p></p></div>
        <div id="bookShadowButton" class="button"><div class="icon"></div><p></p></div>
        <div id="themeSelectionContainer">
            <select id="themeSelection"></select>
        </div>
        <div id="languageSelectionContainer">
            <select id="languageSelection"></select>
        </div>
    </div>

    
    
    <div id="eyeFilter"></div>
   <div id="bottomControls">
    <button id="selectTemplateButton">Select Template</button>
  </div>
</body>
<script src="./js/annyang.js"></script>
<script type="module" src="./js/read.js"></script>
 <script src="./js/speechkiit.js"></script>
 
</html>
