    <style>
     

      
        #selector {
            position: fixed;
            top: 70px;
            width: 150px;
            height: 70vh;
            background-color: green;
            color: white;
            padding: 10px;
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.2);
            transition: right 0.3s ease;
			right: 10px;
        }
		 .selector img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Cover the container */
        }
		
		/* for left panal */
		
		 @keyframes slideIn {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes movePupils {
            0% { transform: translate(0, 0); }
            25% { transform: translate(5px, 5px); }
            50% { transform: translate(0, 5px); }
            75% { transform: translate(-5px, 5px); }
            100% { transform: translate(0, 0); }
        }

        .curvy-panel {
            position: fixed;
            left: 0;
            top: 10%;
            width: 250px;
            height: 60%;
            background: linear-gradient(135deg, #ffcc99, #ff99cc);
            border-radius: 40px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            color: white;
            font-family: Arial, sans-serif;
            overflow-y: auto;
            animation: slideIn 1s ease-out;
        }

        .curvy-panel h2 {
            margin-top: 0;
            text-align: center;
        }

        .curvy-panel p {
            margin-bottom: 20px;
        }

        .eye {
            width: 25px;
            height: 25px;
            background: aqua;
            border-radius: 50%;
            position: absolute;
            top: -1px; /* Positioning eyes above the panel */
            left: 50%; 
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pupil {
            width: 10px;
            height: 10px;
            background: black;
            border-radius: 50%;
            animation: movePupils 5s infinite;
        }

        .eye-right {
            margin-left: 25px; /* Adjust spacing between eyes */
        }

        .eye-container {
            display: flex;
            justify-content: center;
            position: relative;
            top: -20px;
        }
		.line-highlight {
    border: 2px solid #FFD700;  /* Golden outline */
    border-radius: 15px;         /* Curvy shape */
    padding: 4px;                /* Adjust spacing as needed */
    box-shadow: 0px 0px 10px rgba(255, 215, 0, 0.5); /* Soft glow */
    background-color: rgba(255, 250, 200, 0.1); /* Light background */
}
      </style>
	</head>

<body>
