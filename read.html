    <style>
     

        #container {
            position: relative;
        }


 #selectTemplateButton {
     position: fixed;

    border: 1px solid black;

        #navImage {
            position: relative;

            position: relative;
        }

        #textAreaLeft,
        #textAreaRight {
            position: absolute;
            display: none;
            z-index: 10;
            width: 200px; /* Adjust as needed */
            height: 100px; /* Adjust as needed */
            background: transparent;
        }

        #selector {
            position: fixed;
            top: 70px;
            width: 150px;
            height: 70vh;
            background-color: green;
            color: white;
            padding: 10px;

			right: 10px;
        }
		 .selector img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Cover the container */
        }
  .panel {
            height: 80vh;
            width: 200px; /* Adjusted width */
            position: fixed;
            top: 10px;
            left: -200px; /* Start off-screen */
            background-color: green;
            overflow-x: hidden;
            padding-top: 60px;
            color: white;
            text-align: left;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.5); /* Optional shadow for better visibility */
            transition: left 0.5s ease; /* Animation for floating effect */
        }

        .panel.visible {
            left: 0; /* Slide into view */
        }

        .panel h2 {
            padding-left: 20px;
        }

        .panel p {
            padding-left: 20px;
        }

<body>
    <div id="loaderContainer">

        </div>
